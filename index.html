<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的移动 Web App</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #333;
      text-align: center;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 360px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #1a202c;
    }
    p {
      color: #4a5568;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    button {
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1.5rem;
      width: 100%;
      transition: background-color 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.97);
      background-color: #1d4ed8;
    }
    #output {
      margin-top: 1.2rem;
      font-weight: 600;
      color: #059669;
      min-height: 24px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>🚀 我的第一个 GitHub App</h1>
    <p>点击下方按钮测试网页交互功能：</p>
    <button onclick="showMessage()">点击测试</button>
    <p id="output"></p>
  </div>

  <script>
    function showMessage() {
      document.getElementById("output").innerText = "🎉 恭喜！你的 GitHub Web App 已成功运行！";
    }
  </script>

</body>
</html>
